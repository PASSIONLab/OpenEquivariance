name: OEQ C++ Extension Build Verification

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]
    types: [ labeled ]

permissions:
  contents: read

jobs:
  verify_cuda_extension:
    if: ${{ github.event.label.name == 'ci-ready' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: '**/requirements_cuda_ci.txt'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update
        sudo apt install nvidia-cuda-toolkit
        pip install -r .github/workflows/requirements_cuda_ci.txt
        pip install -e "./openequivariance[jax]"

    - name: Test CUDA extension build via import 
      run: |
        pytest tests/import_test.py

    - name: Test JAX extension build
      run: |
        XLA_DIRECT_DOWNLOAD=1 pip install -e "./openequivariance_extjax" --no-build-isolation

  verify_hip_extension:
    if: ${{ github.event.label.name == 'ci-ready' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install pinned rocm-sdk-core
      run: |
        python .github/release.py install-rocm-sdk openequivariance/pyproject.toml "$RUNNER_TEMP/rocm-sdk-core"

    - name: Build HIP extension
      env:
        ROCM_PATH: ${{ runner.temp }}/rocm-sdk-core/_rocm_sdk_core
      run: |
        pip wheel --no-deps -w dist ./openequivariance

  verify_sycl_extension:
    if: ${{ github.event.label.name == 'ci-ready' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: '**/requirements_sycl_ci.txt'

    - name: Install oneAPI DPC++
      run: |
        wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        # Must match the intel-sycl-rt version required by torch in requirements_sycl_ci.txt
        sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp-2026.0=2026.0.0-947

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/workflows/requirements_sycl_ci.txt
        source /opt/intel/oneapi/setvars.sh
        export CXX=icpx
        pip install -e "./openequivariance[sycl]"

    - name: Test SYCL extension build via import
      run: |
        source /opt/intel/oneapi/setvars.sh
        export CXX=icpx

        pytest tests/import_test.py
