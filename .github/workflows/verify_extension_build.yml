name: OEQ C++ Extension Build Verification

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]
    types: [ labeled ]

permissions:
  contents: read

jobs:
  verify_cuda_extension:
    if: ${{ github.event.label.name == 'ci-ready' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: '**/requirements_cuda_ci.txt'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update
        sudo apt install nvidia-cuda-toolkit
        pip install -r .github/workflows/requirements_cuda_ci.txt
        pip install -e "./openequivariance[jax]"

    - name: Test CUDA extension build via import 
      run: |
        pytest tests/import_test.py

        export OEQ_JIT_EXTENSION=1

        pytest tests/import_test.py

    - name: Test JAX extension build
      run: |
        XLA_DIRECT_DOWNLOAD=1 pip install -e "./openequivariance_extjax" --no-build-isolation

  verify_sycl_extension:
    if: ${{ github.event.label.name == 'ci-ready' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: '**/requirements_sycl_ci.txt'

    - name: Install oneAPI DPC++
      run: |
        wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
          | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        # Must match the intel-sycl-rt version required by torch in requirements_sycl_ci.txt
        sudo apt-get install -y intel-oneapi-compiler-dpcpp-cpp-2026.0=2026.0.0-947

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/workflows/requirements_sycl_ci.txt
        pip install -e "./openequivariance"

    - name: Test SYCL extension build via import
      run: |
        source /opt/intel/oneapi/setvars.sh
        export CXX=icpx

        pytest tests/import_test.py

        export OEQ_JIT_EXTENSION=1

        pytest tests/import_test.py 