version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "semiannually"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/.github/workflows"
    schedule:
      interval: "semiannually"
    groups:
      ci-requirements:
        patterns: ["*"]
    cooldown:
      default-days: 7
