[build-system]
requires = ["setuptools", "setuptools-scm", "scikit-build-core", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "openequivariance"
version = "0.0.1"
authors = [
  { name="Austin Glover" },
  { name="Vivek Bharadwaj" },
  { name="Aydin Buluc" },
  { name="James Demmel" }
]
description = "A fast GPU JIT kernel generator for the Clebsch-Gordon Tensor Product"
requires-python = ">=3.11"
dependencies = [
  "jinja2",
  "numpy",
  "nanobind-backend>=1.0"
]
readme = "README.md"

license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage = "https://passionlab.github.io/OpenEquivariance/"
source = "https://github.com/PASSIONLab/OpenEquivariance"
issues = "https://github.com/PASSIONLab/OpenEquivariance/issues"


[project.optional-dependencies]
bench = [
  "matplotlib",
  "tqdm",
  "e3nn",
  "cuequivariance",
  "cuequivariance-torch",
  "cuequivariance-ops-torch-cu12",
]

dev = [
  "e3nn",
  "pre-commit",
  "ruff",
  "pytest",
  "pytest-check",
  "pytest-subtests",
  "torch_geometric",
  "cmake"
]

sycl = [
  "setuptools",
  "ninja"
]

jax = [
  "jax>=0.8.1"
]

[tool.setuptools.packages.find]
include = ["openequivariance*"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
lint.ignore = ["E741"]

[tool.scikit-build]
wheel.py-api = "cp311"
build-dir = "build/{wheel_tag}"
editable.rebuild = true

[tool.scikit-build.cmake.define]
AARCH64 = {env="AARCH64", default="0"}
LIBTORCH_URL_X86_64 = "https://download.pytorch.org/libtorch/cpu/libtorch-shared-with-deps-2.10.0%2Bcpu.zip"
LIBTORCH_SHA256_X86_64 = "c5bf8efda9224a2d971b19d1ef6cf3ba6fee8ab53e69c49427db003d1d300496"
LIBTORCH_URL_AARCH64 = "https://github.com/PASSIONLab/libtorch_aarch64/raw/742ffd07f47a31a94f6b6aae2cbe129e6b667d94/pkg-libtorch.tar.zst"
LIBTORCH_SHA256_AARCH64 = "9fdebdb56766317c71eb4c9f1b750baef4ebc4e6ba85b427f701fdc20844f909"
XLA_FFI_COMMIT = "a7e58876b73dfa9bb6bc785f6981a332c133bb55"
XLA_FFI_C_API_SHA256 = "aca130ddbe816672f9d302364d28813b1922c90baf7bc4818f3169d375c5ecc3"
XLA_FFI_API_SHA256 = "f7080e6a7d2578961c100c5042d1db8f85c57e1595ceb7a11f55422db808c62c"
XLA_FFI_FFI_SHA256 = "fe6b5bfbaa3f13e72f9bc46f5e5fc62ef782e3dd4a41bb08867904602ed615e7"

[tool.cibuildwheel]
build = "cp311-*"
skip = "*-musllinux*"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = [
  "/opt/python/cp312-cp312/bin/python {project}/.github/release.py install-cuda-toolkits $OEQ_CUDA_ROOTS",
  "/opt/python/cp312-cp312/bin/python {project}/.github/release.py install-rocm-sdk {package}/pyproject.toml /opt/rocm-sdk-core",
]
build-verbosity = 1

[tool.cibuildwheel.linux.environment]
OEQ_CUDA_ROOTS = "/usr/local/cuda-12.6 /usr/local/cuda-13.0"
ROCM_PATH = "/opt/rocm-sdk-core/_rocm_sdk_core"

[tool.cibuildwheel.linux]
repair-wheel-command = """auditwheel repair -w {dest_dir} {wheel} \
  --exclude libtorch_cpu.so --exclude libc10.so \
  --exclude libtorch_cuda.so --exclude libtorch_hip.so \
  --exclude libcuda.so.1 --exclude 'libcudart.so.*' --exclude 'libnvrtc.so.*' \
  --exclude 'libamdhip64.so.*' --exclude 'libhiprtc.so.*'"""

[tool.openequivariance.rocm-sdk-core]
index-url = "https://download.pytorch.org/whl/rocm10.0"
version = "10.0.0"
sha256 = "3bf4a72d11aa2a4ee1e90572c73630f937d38c1b7af4dda45b483b54655138a7"
